name: Looma CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "security/**", "docs/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Unit & Worker Tests, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun 1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: npm run lint

      - name: Run unit and Worker API tests
        run: npx --yes tsx --test src/utils/*.test.ts src/services/*.test.ts src/worker.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Install Commerce workspace dependencies
        run: bun install --cwd commerce

      - name: Commerce typecheck & integration tests
        run: |
          npm --prefix commerce run typecheck:all
          npx --yes tsx --test commerce/artifacts/api-server/src/routes/sso.test.ts commerce/artifacts/luxe-boutique-admin/src/lib/loomaUrl.test.ts

      - name: Build Commerce production bundle
        env:
          VITE_LOOMA_APP_URL: https://looma.prigidcollection.workers.dev
        run: npm --prefix commerce run build
